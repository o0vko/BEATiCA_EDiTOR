name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Build
        run: uv run build.py

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="BEATiCA-EDiTOR-${{ matrix.platform }}"
          tar -czf "${NAME}.tar.gz" -C dist .
          echo "ARCHIVE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential libltdl-dev libdouble-conversion3 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0

      - name: Sync dependencies (android)
        run: uv sync --group android

      - name: Prepare Android SDK/NDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" "ndk;28.2.13676358"
          # buildozerは旧パス tools/bin/sdkmanager を参照するためシンボリックリンクを張る
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          for tool in sdkmanager avdmanager lint retrace; do
            src="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/$tool"
            [ -f "$src" ] && ln -sf "$src" "$ANDROID_SDK_ROOT/tools/bin/$tool"
          done
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_TARGET: android
          BUILD_ARCH: aarch64
        run: uv run build.py

      - name: Dump config.log on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "== PWD =="; pwd
          echo "== .buildozer =="; ls -la .buildozer 2>/dev/null || echo "no .buildozer"
          echo "== ~/.buildozer =="; ls -la "$HOME/.buildozer" 2>/dev/null || echo "no ~/.buildozer"
          echo "== config.log search (/home/runner) =="
          find /home/runner -name config.log 2>/dev/null | while read -r f; do
            echo "===== $f ====="
            tail -n 80 "$f" 2>/dev/null || true
          done
          echo "== *.log under .buildozer =="
          find .buildozer "$HOME/.buildozer" -name '*.log' 2>/dev/null | while read -r f; do
            echo "===== $f ====="
            tail -n 40 "$f" 2>/dev/null || true
          done

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          files=( $(find . -path ./.venv -prune -o -name '*.apk' -print) $(find . -path ./.venv -prune -o -name '*.aab' -print) )
          for f in "${files[@]}"; do
            cp "$f" "release/BEATiCA-EDiTOR-android-$(basename "$f")"
          done
          ls -la release
          echo "APK/AAB count: ${#files[@]}"
          tar -czf BEATiCA-EDiTOR-android.tar.gz -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: BEATiCA-EDiTOR-android.tar.gz

  release:
    name: Create release and notify Discord
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release
          {
            echo 'files<<EOF'
            find release -type f | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ github.ref_type == 'tag' && github.ref_name || format('Build #{0}', github.run_number) }}"
          draft: false
          prerelease: true
          files: release/*

      - name: Send to Discord webhook
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping"
            exit 0
          fi
          mapfile -t FILES < <(find release -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No files to send"
            exit 0
          fi
          CONTENT="BEATiCA EDiTOR ビルド完了 (${{ github.ref_name }})"
          ARGS=(-sS -H "Content-Type: multipart/form-data")
          ARGS+=(-F "payload_json=$(jq -nc --arg c "$CONTENT" '{content:$c}')")
          for f in "${FILES[@]}"; do
            ARGS+=(-F "files=@${f}")
          done
          curl "${ARGS[@]}" "$DISCORD_WEBHOOK_URL"
