name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Build
        run: uv run build.py

      # Windows ZIP
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/* `
            -DestinationPath BEATiCA-EDiTOR-windows.zip

          "ARCHIVE=BEATiCA-EDiTOR-windows.zip" >> $env:GITHUB_ENV

      # macOS APP -> ZIP
      - name: Package macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP" ]; then
            echo "No .app bundle found in dist/"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" BEATiCA-EDiTOR-macos.zip

          echo "ARCHIVE=BEATiCA-EDiTOR-macos.zip" >> "$GITHUB_ENV"

      # Linux TAR.GZ
      - name: Package Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          tar -czf BEATiCA-EDiTOR-linux.tar.gz -C dist .

          echo "ARCHIVE=BEATiCA-EDiTOR-linux.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  android:
    name: Build Android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk \
            zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential \
            libltdl-dev libdouble-conversion3 \
            libxkbcommon0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-render-util0

      - name: Sync dependencies (android)
        run: uv sync --group android

      - name: Prepare Android SDK/NDK
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          SDKM="$(command -v sdkmanager || true)"

          if [ -z "$SDKM" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          # NDK r28c
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" "ndk;28.2.13676358"

          # Legacy SDK Manager path
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          for tool in sdkmanager avdmanager lint retrace; do
            src="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/$tool"
            [ -f "$src" ] && ln -sf "$src" "$ANDROID_SDK_ROOT/tools/bin/$tool"
          done

          # Permissions
          chmod +x -R "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true
          chmod +x -R "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true
          chmod +x -R "$ANDROID_SDK_ROOT/platform-tools" 2>/dev/null || true

          # NDK environment
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_TARGET: android
          BUILD_ARCH: aarch64
          ANDROIDMINAPI: "21"
          ANDROID_NDK_API: "21"
        run: |
          set -uo pipefail

          mkdir -p /home/runner/cl

          # Capture config.log before buildozer removes it
          (
            while true; do
              find /home/runner/work -name config.log 2>/dev/null |
              while read -r f; do
                d="/home/runner/cl/$(echo "$f" | md5sum | cut -c1-8)-$(basename "$(dirname "$f")")"
                cp -f "$f" "$d" 2>/dev/null || true
              done
              sleep 0.2
            done
          ) &

          WATCHER=$!

          trap '
            kill "$WATCHER" 2>/dev/null || true
            echo "=== captured config.log ==="
            for f in /home/runner/cl/*; do
              [ -f "$f" ] && {
                echo "===== $f ====="
                cat "$f"
              }
            done
          ' EXIT

          uv run build.py

      - name: Dump config.log on failure
        if: failure()
        run: |
          set -uo pipefail

          echo "== PWD =="
          pwd

          echo "== .buildozer =="
          ls -la .buildozer 2>/dev/null || echo "no .buildozer"

          echo "== ~/.buildozer =="
          ls -la "$HOME/.buildozer" 2>/dev/null || echo "no ~/.buildozer"

          echo "== config.log search =="
          find /home/runner -name config.log 2>/dev/null |
          while read -r f; do
            echo "===== $f ====="
            tail -n 80 "$f" 2>/dev/null || true
          done

          echo "== *.log under .buildozer =="
          find .buildozer "$HOME/.buildozer" -name '*.log' 2>/dev/null |
          while read -r f; do
            echo "===== $f ====="
            tail -n 40 "$f" 2>/dev/null || true
          done

      - name: Inspect Android toolchain
        if: always()
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "== Android clang binaries =="
          ls -l "$BIN"/aarch64-linux-android*-clang*

          echo "== Clang version =="
          "$BIN/clang" --version

      - name: Debug Android compiler
        if: always()
        run: |
          set +e

          NDK="$ANDROID_NDK_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$BIN/clang"

          echo 'int main(void) { return 0; }' > /tmp/test.c

          echo "== Android target compiler =="
          ls -l "$BIN"/aarch64-linux-android*-clang*

          echo "== Compile test =="
          "$CLANG" \
            --target=aarch64-linux-android28 \
            /tmp/test.c \
            -o /tmp/test 2>&1

          RESULT=$?
          echo "Compiler exit code: $RESULT"

          echo "== Output file =="
          ls -l /tmp/test 2>&1 || true

      # APK direct distribution
      - name: Package Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          mapfile -d '' files < <(
            find . \
              -path ./.venv -prune -o \
              -type f -name '*.apk' -print0
          )

          for f in "${files[@]}"; do
            cp "$f" "release/$(basename "$f")"
          done

          ls -lah release

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No APK found"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.15

      - name: Sync dependencies (ios)
        run: uv sync --group ios --python 3.15

      - name: Build
        env:
          BUILD_TARGET: ios
        run: uv run --python 3.15 build.py

      # IPA direct distribution
      - name: Package iOS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find dist -type f -name '*.ipa' -exec cp {} release/ \;

          ls -lah release

          if ! compgen -G "release/*.ipa" > /dev/null; then
            echo "No IPA found"
            exit 1
          fi

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: release/*.ipa
          if-no-files-found: error

  release:
    name: Create release and notify Discord
    needs: [build, android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail

          mkdir -p release

          find artifacts -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name '*.apk' -o \
            -name '*.ipa' \
          \) -exec cp {} release/ \;

          ls -lah release

          {
            echo 'files<<EOF'
            find release -type f | sort
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ github.ref_type == 'tag' && github.ref_name || format('Build #{0}', github.run_number) }}"
          draft: false
          prerelease: true
          files: release/*

      - name: Send to Discord webhook
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping"
            exit 0
          fi

          CONTENT=$'**BEATiCA EDiTOR** New version Released\n'"${RELEASE_URL}"

          curl -sS \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$CONTENT" '{content:$c}')" \
            "$DISCORD_WEBHOOK_URL"
