[project]
name = "beatica-editor"
version = "0.0.1"
description = "BEATiCA Editor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.12.0",
    "qtawesome>=1.4.2",
]

[dependency-groups]
dev = [
    "jurigged>=0.6.1",
    "pillow>=13.0.0",
    "pip>=26.3",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
# Androidビルド用（pyside6-android-deploy + buildozer + qtpip）。SDK/NDK/Javaは別途必要
android = [
    "buildozer==1.6.0",
    "qtpip>=0.2.0",
    "jinja2",
    "pkginfo",
    "tqdm",
]
# iOSビルド用（pyside6-ios-deploy）。Xcode と Python 3.15 が必要
ios = [
    "certifi",
    "jinja2",
    "pkginfo",
    "tqdm",
]

[tool.pyside6.deploy]
title = "BEAEDiT"
input_file = "main.py"
exec_directory = "dist"
mode = "standalone"
extra_args = "--quiet --noinclude-qt-translations --include-data-dir=assets=assets --assume-yes-for-downloads"
