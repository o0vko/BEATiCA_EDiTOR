workflows:
  windows:
    name: Windows
    instance_type: windows_x2
    scripts:
      - name: Install uv
        script: python -m pip install --upgrade uv
      - name: Build
        script: |
          uv python install 3.13
          uv sync
          uv run build.py
      - name: Package
        script: python -c "import shutil; shutil.make_archive('BEATiCA-EDiTOR-windows', 'gztar', 'dist')"
    artifacts:
      - BEATiCA-EDiTOR-windows.tar.gz
    publishing:
      scripts:
        - name: Discord
          script: |
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -sS -F "payload_json={\"content\":\"BEATiCA EDiTOR Windows build\"}" -F "files=@BEATiCA-EDiTOR-windows.tar.gz" "$DISCORD_WEBHOOK_URL"
            fi

  macos:
    name: macOS
    instance_type: mac_mini_m2
    scripts:
      - name: Install uv
        script: python3 -m pip install --upgrade uv
      - name: Build
        script: |
          uv python install 3.13
          uv sync
          uv run build.py
      - name: Package
        script: python3 -c "import shutil; shutil.make_archive('BEATiCA-EDiTOR-macos', 'gztar', 'dist')"
    artifacts:
      - BEATiCA-EDiTOR-macos.tar.gz
    publishing:
      scripts:
        - name: Discord
          script: |
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -sS -F "payload_json={\"content\":\"BEATiCA EDiTOR macOS build\"}" -F "files=@BEATiCA-EDiTOR-macos.tar.gz" "$DISCORD_WEBHOOK_URL"
            fi

  linux:
    name: Linux
    instance_type: linux
    scripts:
      - name: Install uv
        script: python3 -m pip install --upgrade uv
      - name: Build
        script: |
          uv python install 3.13
          uv sync
          uv run build.py
      - name: Package
        script: python3 -c "import shutil; shutil.make_archive('BEATiCA-EDiTOR-linux', 'gztar', 'dist')"
    artifacts:
      - BEATiCA-EDiTOR-linux.tar.gz
    publishing:
      scripts:
        - name: Discord
          script: |
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              curl -sS -F "payload_json={\"content\":\"BEATiCA EDiTOR Linux build\"}" -F "files=@BEATiCA-EDiTOR-linux.tar.gz" "$DISCORD_WEBHOOK_URL"
            fi

  android:
    name: Android
    instance_type: linux
    environment:
      vars:
        BUILD_TARGET: android
        BUILD_ARCH: aarch64
    scripts:
      - name: Install system dependencies
        script: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache libltdl-dev
      - name: Install uv
        script: python3 -m pip install --upgrade uv
      - name: Build
        script: |
          uv python install 3.13
          uv sync --group android
          uv run build.py
      - name: Package
        script: python3 -c "import shutil,glob,os; fs=glob.glob('dist/*.apk')+glob.glob('dist/*.aab')+glob.glob('bin/*.apk'); [shutil.copy(f, 'BEATiCA-EDiTOR-android-'+os.path.basename(f)) for f in fs]"
    artifacts:
      - BEATiCA-EDiTOR-android-*.apk
      - BEATiCA-EDiTOR-android-*.aab
    publishing:
      scripts:
        - name: Discord
          script: |
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              for f in BEATiCA-EDiTOR-android-*.apk; do
                [ -f "$f" ] && curl -sS -F "payload_json={\"content\":\"BEATiCA EDiTOR Android build\"}" -F "files=@$f" "$DISCORD_WEBHOOK_URL"
              done
            fi